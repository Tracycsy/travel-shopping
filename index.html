<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅行購物清單</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
<style>
:root{
  --bg:#F5F2EC; --surface:#FFFFFF; --surface2:#FAF7F2; --sand:#EFE6D5; --sand-ink:#6B5532;
  --ink:#13232B; --muted:#4E626C; --faint:#566A74;
  --line:#E4DED3; --line2:#EEE9E0;
  --sea:#076F80; --sea-soft:#E2F2F4; --sea-deep:#055866;
  --coral:#B53D28; --coral-soft:#FCEDE8;
  --amber:#875811; --amber-soft:#F8EEDB;
  --shadow:0 1px 2px rgba(19,35,43,.05),0 6px 16px rgba(19,35,43,.05);
  --font:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1417; --surface:#132024; --surface2:#182A2F; --sand:#2A2418; --sand-ink:#E3CDA4;
  --ink:#E7F0F2; --muted:#A6B7BE; --faint:#8C9FA7;
  --line:#25363C; --line2:#1C2B30;
  --sea:#4CC8D9; --sea-soft:#0F3038; --sea-deep:#7ED9E5;
  --coral:#FF8B75; --coral-soft:#3A1F19;
  --amber:#E8B04F; --amber-soft:#33280F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.22);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1417; --surface:#132024; --surface2:#182A2F; --sand:#2A2418; --sand-ink:#E3CDA4;
  --ink:#E7F0F2; --muted:#A6B7BE; --faint:#8C9FA7;
  --line:#25363C; --line2:#1C2B30;
  --sea:#4CC8D9; --sea-soft:#0F3038; --sea-deep:#7ED9E5;
  --coral:#FF8B75; --coral-soft:#3A1F19;
  --amber:#E8B04F; --amber-soft:#33280F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.22);
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
::selection{background:var(--sea-soft);color:var(--ink)}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  caret-color:var(--sea);accent-color:var(--sea);
  padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
img{max-width:100%}
button{font-family:inherit;color:inherit}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,label:focus-within{outline:2px solid var(--sea);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;display:block}
.ic.sm{width:16px;height:16px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:540px;margin:0 auto}

/* ── header (scrolls away) ── */
header{padding-top:calc(14px + env(safe-area-inset-top,0px))}
.hrow{display:flex;align-items:center;gap:8px}
.htitle{min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:22px;font-weight:750;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hbtns{margin-left:auto;display:flex;gap:2px;align-items:center;flex:0 0 auto}
.themebtn{background:none;border:0;color:var(--muted);width:40px;height:40px;display:grid;place-items:center;cursor:pointer;border-radius:10px}
.authbtn{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:650;color:var(--muted);height:36px;padding:0 11px 0 9px;cursor:pointer;white-space:nowrap}
.authbtn .ic{width:17px;height:17px}
.authbtn.on{color:var(--sea);border-color:var(--sea);background:var(--sea-soft)}
.tripbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.tripbar::-webkit-scrollbar{display:none}
.tchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.tchip[aria-pressed="true"]{border-color:var(--sea);color:var(--sea);background:var(--sea-soft)}
.stats{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:750;font-size:15px;font-variant-numeric:tabular-nums}
.stats b.pos{color:var(--sea)} .stats b.neg{color:var(--coral)}
.stats small{font-size:12px;color:var(--faint)}

/* ── sticky filter bar ── */
.fbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);margin-top:10px}
.frow{display:flex;align-items:center;gap:10px;padding-block:9px}
.seg{display:flex;flex:0 0 auto;background:var(--line2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;font-size:13px;font-weight:650;color:var(--muted);padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:24px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:550;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.banner{border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55;margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.arch{background:var(--amber-soft);color:var(--amber)}
.banner.info{background:var(--sea-soft);color:var(--sea)}
.banner button{margin-left:auto;border:1px solid currentColor;background:none;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:650;cursor:pointer;color:inherit}

/* ── panels ── */
.panels{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel>summary{list-style:none;cursor:pointer;padding:11px 14px;font-size:14px;font-weight:650;display:flex;align-items:center;gap:9px;color:var(--ink)}
.panel>summary .ic{color:var(--sea)}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary .chev{margin-left:auto;color:var(--faint);transition:transform .2s}
.panel[open]>summary .chev{transform:rotate(180deg)}
.pbody{padding:12px 14px 14px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line2)}
.pbody b{color:var(--ink);font-weight:650}
.setrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.setrow:last-of-type{border-bottom:0}
.setrow label{font-size:13.5px;color:var(--ink);flex:1;min-width:0}
.hint{font-size:12px;color:var(--faint);display:block;font-weight:400}
input[type=number],input[type=text],input[type=email],textarea,select{font-family:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input::placeholder,textarea::placeholder{color:var(--faint)}
input[type=number]{font-variant-numeric:tabular-nums}
.setrow input[type=number]{width:104px;text-align:right}
.switch{position:relative;width:46px;height:28px;flex:0 0 auto}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;z-index:2;cursor:pointer}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:var(--surface);border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--sea)}
.switch input:checked+span::after{transform:translateX(18px)}
.notes{font-size:13px;line-height:1.7;margin-top:10px;white-space:pre-line}
.linkbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lbtn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:650;cursor:pointer}
.lbtn.warn{color:var(--coral)}

.flight{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.fpill{font-size:12px;background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:3px 8px;font-variant-numeric:tabular-nums;color:var(--ink)}
.pday{padding:10px 0;border-bottom:1px solid var(--line2)}
.pday:last-child{border-bottom:0}
.pday h3{margin:0 0 4px;font-size:13.5px;color:var(--ink);font-weight:700}
.stop{display:grid;grid-template-columns:44px 1fr;gap:6px;font-size:13px;padding:2px 0}
.stop .t{color:var(--faint);font-variant-numeric:tabular-nums}
.stop .n{color:var(--ink);min-width:0}
.stop .n small{display:block;color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--sea);background:var(--sea-soft);border-radius:5px;padding:0 5px;margin-left:5px;vertical-align:1px}

/* ── day sections ── */
.dsec{margin-top:22px;scroll-margin-top:calc(64px + env(safe-area-inset-top,0px))}
.dhead{display:flex;align-items:center;gap:12px;padding:0 2px 10px}
.dnum{flex:0 0 auto;width:48px;height:48px;border-radius:14px;background:var(--sand);color:var(--sand-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dnum span{font-size:11.5px;font-weight:650;letter-spacing:.02em}
.dnum b{font-size:21px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.dsec.today .dnum{background:var(--sea);color:var(--surface)}
.dmain{flex:1;min-width:0}
.dmain h2{margin:0;font-size:16px;font-weight:750;line-height:1.3}
.dmeta{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.dmeta .when{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.today-pill{display:inline-block;font-size:11.5px;font-weight:750;color:var(--surface);background:var(--coral);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px}
.dcount{font-size:12.5px;color:var(--faint);flex:0 0 auto;font-variant-numeric:tabular-nums}
.wave{display:block;width:100%;height:8px;color:var(--sea);opacity:.35;margin:-2px 0 10px}
.dempty{font-size:13px;color:var(--faint);padding:2px 2px 0 62px;margin-top:-4px}
.ghead{display:flex;align-items:baseline;gap:8px;margin:22px 2px 10px}
.ghead h2{font-size:16px;font-weight:750;margin:0}
.ghead .n{font-size:12.5px;color:var(--faint);margin-left:auto}

/* ── item card ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;transition:opacity .2s}
.card.bought{opacity:.6}
.ctop{display:flex;gap:12px;padding:12px 12px 10px}
.thumb{flex:0 0 66px;width:66px;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--surface2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--faint)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card.bought .thumb img{filter:grayscale(1)}
.cmain{flex:1;min-width:0}
.nzh{font-size:15px;font-weight:700;line-height:1.32;margin:0}
.card.bought .nzh{text-decoration:line-through;text-decoration-color:var(--faint)}
.meta{font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.lname{display:flex;align-items:flex-start;gap:6px;width:100%;text-align:left;margin-top:6px;border:1px dashed var(--line);background:var(--surface2);border-radius:9px;padding:6px 8px;font-size:12.5px;line-height:1.4;color:var(--ink);cursor:pointer}
.lname .ic{width:15px;height:15px;color:var(--sea);margin-top:2px}
.lname span{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.bdg{font-size:11.5px;font-weight:650;padding:2px 7px;border-radius:6px;line-height:1.5}
.bdg.pri{background:var(--coral-soft);color:var(--coral)}
.bdg.gift,.bdg.warn{background:var(--amber-soft);color:var(--amber)}
.bdg.where{background:var(--sea-soft);color:var(--sea)}
.price{display:flex;align-items:baseline;gap:10px;padding:9px 12px;border-top:1px solid var(--line2);flex-wrap:wrap}
.price .amt{font-size:17px;font-weight:750;font-variant-numeric:tabular-nums}
.price .conv{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
.price .hk{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.price .hk b{font-size:15px;color:var(--ink);font-weight:700;margin-left:4px}
.price .hk.none{color:var(--faint)}
.verdict{padding:7px 12px;font-size:13px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.verdict.win{background:var(--sea-soft);color:var(--sea)}
.verdict.lose{background:var(--coral-soft);color:var(--coral)}
.verdict.even{background:var(--surface2);color:var(--muted);border-top:1px solid var(--line2)}
.acts{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line2);background:var(--surface2)}
.buy{flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;transition:background-color .15s,color .15s,border-color .15s}
.buy[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--surface)}
.qty{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden;height:44px}
.qty button{width:40px;height:44px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.qty span{min-width:18px;text-align:center;font-size:14px;font-weight:750;font-variant-numeric:tabular-nums}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:11px;cursor:pointer;color:var(--faint);display:grid;place-items:center}
.iconbtn[aria-pressed="true"].p{background:var(--coral-soft);border-color:var(--coral);color:var(--coral)}
.iconbtn[aria-pressed="true"].p .ic{fill:currentColor}
.more{border-top:1px solid var(--line2)}
.more>summary{list-style:none;cursor:pointer;padding:8px 12px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:4px}
.more>summary .ic{width:14px;height:14px;transition:transform .2s}
.more[open]>summary .ic{transform:rotate(180deg)}
.more>summary::-webkit-details-marker{display:none}
.mbody{padding:0 12px 12px;font-size:13px;color:var(--muted);line-height:1.6}
.mbody .row{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line2)}
.mbody .row .k{flex:0 0 72px;color:var(--faint);font-size:12.5px}
.mbody .row .v{flex:1;color:var(--ink);min-width:0;word-break:break-word}
.mbody a{color:var(--sea);text-underline-offset:3px}
.note{background:var(--amber-soft);color:var(--amber);border-radius:9px;padding:8px 10px;margin-top:8px;font-size:13px;line-height:1.55;white-space:pre-line}

.empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 16px;line-height:1.7;background:var(--surface);border:1px dashed var(--line);border-radius:14px;margin-top:16px}
.empty b{color:var(--ink)}

.past{margin-top:30px}
.past>summary{list-style:none;cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:650;padding:12px 2px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.past>summary::-webkit-details-marker{display:none}
.past>summary .chev{margin-left:auto;color:var(--faint)}
.past[open]>summary .chev{transform:rotate(180deg)}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.prow .nm{font-weight:650;font-size:14px}
.prow .mt{font-size:12px;color:var(--faint)}
.prow .go{margin-left:auto;color:var(--faint)}
.foot{text-align:center;font-size:12px;color:var(--faint);padding:20px 0 6px;line-height:1.7}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar button{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--sea);color:var(--surface);border-radius:12px;height:48px;font-size:15px;font-weight:700;cursor:pointer}
.bar button:disabled{opacity:.45}

/* ── dialogs ── */
dialog{border:0;border-radius:18px 18px 0 0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:540px;margin:auto auto 0;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.mhead{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);z-index:2}
.mhead h2{margin:0;font-size:16px;font-weight:750}
.mhead button{margin-left:auto;background:none;border:0;font-size:15px;color:var(--muted);cursor:pointer;height:40px;padding:0 4px}
.mcont{padding:14px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:650}
.fld label.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:550;margin:0;cursor:pointer}
.fld label.check input{width:20px;height:20px;margin:0}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}
.photopick{display:flex;gap:12px;align-items:center}
.preview{width:66px;aspect-ratio:3/4;border-radius:10px;border:1px solid var(--line);background:var(--surface2) center/cover no-repeat;display:grid;place-items:center;color:var(--faint);flex:0 0 auto}
.preview.has .ic{display:none}
.pickbtn{display:inline-flex!important;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;font-size:14px!important;font-weight:650;color:var(--ink)!important;cursor:pointer;margin:0!important}
.pickbtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.submit{width:100%;height:48px;border:0;border-radius:12px;background:var(--sea);color:var(--surface);font-size:15px;font-weight:700;cursor:pointer}
.submit:disabled{opacity:.6}
.danger{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:none;color:var(--coral);font-size:14px;font-weight:650;cursor:pointer;margin-top:10px}
.msg{font-size:13px;text-align:center;margin-top:10px;min-height:18px;color:var(--coral)}
.msg.ok{color:var(--sea)}
.lead{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.6}
.lead.sm{font-size:13px;margin-bottom:12px}

/* show-to-staff screen */
dialog.staff{margin:0;width:100%;max-width:none;height:100%;max-height:none;border-radius:0;background:var(--surface)}
.staffin{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;
  padding:calc(64px + env(safe-area-inset-top,0px)) 24px calc(32px + env(safe-area-inset-bottom,0px))}
.sclose{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border:0;border-radius:50%;background:var(--surface2);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.sphoto{width:150px;aspect-ratio:3/4;border-radius:14px;background:var(--surface2) center/cover no-repeat;border:1px solid var(--line2)}
.sask{font-size:16px;color:var(--muted);margin:0}
.sbig{font-size:min(34px,7.2vw);font-weight:800;line-height:1.3;color:var(--ink);max-width:100%}
.sbig span{display:inline-block;max-width:100%;overflow-wrap:anywhere}
.ssub{font-size:16px;color:var(--muted)}
.sprice{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-size:13.5px;padding:9px 15px;border-radius:999px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="gut">
  <div class="wrap">
    <div class="hrow">
      <div class="htitle"><h1 id="tName">旅行購物清單</h1><span class="sub" id="tSub">載入緊…</span></div>
      <span class="hbtns">
        <button class="authbtn" id="authBtn"></button>
        <button class="themebtn" id="themeBtn" aria-label="切換深淺色"></button>
      </span>
    </div>
    <div class="tripbar" id="tripbar" hidden></div>
    <div class="stats" id="stats">
      <span><b id="sBought">0/0</b> 已買</span>
      <span>預計 <b id="sSpend">HK$0</b></span>
      <span id="sSaveWrap" hidden>對比香港 <b id="sSave">—</b> <small id="sCmp"></small></span>

<div class="fbar gut" id="fbar">

    <div class="seg" id="seg" role="group" aria-label="點樣分組">

    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main class="gut">
  <div class="wrap">
    <div id="banner"></div>

    <div class="panels" id="panels">
      <details class="panel" id="setPanel">
        <summary><svg class="ic"><use href="#i-sliders"/></svg>匯率、退稅同行程設定<svg class="ic sm chev"><use href="#i-chev"/></svg></summary>
        <div class="pbody">
          <div class="setrow">
            <label for="fx">匯率 <span class="hint" id="fxHint">1 港元 = ?</span></label>
            <input type="number" id="fx" step="0.01" min="0.01" inputmode="decimal">
          </div>
          <div class="setrow">
            <label for="taxOn">計入退稅 <span class="hint" id="taxHint">—</span></label>
            <span class="switch"><input type="checkbox" id="taxOn"><span></span></span>
          </div>
          <div class="notes" id="taxNotes"></div>
          <div class="linkbtns" id="tripActs">
            <button class="lbtn" id="editTripBtn">修改行程資料</button>
            <button class="lbtn" id="newTripBtn">＋ 新行程</button>
            <button class="lbtn warn" id="archBtn">封存呢個行程</button>
          </div>
        </div>
      </details>

      <details class="panel" id="planPanel">
        <summary><svg class="ic"><use href="#i-map"/></svg>行程表同航班<svg class="ic sm chev"><use href="#i-chev"/></svg></summary>

    <div id="list"></div>

    <details class="past" id="past" hidden>

    <p class="foot">價錢係出發前查到嘅參考價，以店舖標價為準。價錢來源喺每件貨嘅「詳情」入面。<br>撳灰色框入面嘅當地名稱，可以放大俾店員睇。<br>傳張截圖或者貨品名畀 Claude，佢會幫你加入清單。</p>
  </div>
</main>

<div class="bar gut">
  <div class="wrap">
    <button id="addBtn" disabled>＋ 新增商品</button>
  </div>
</div>

<dialog id="authDlg">

<dialog id="itemDlg">

    <div class="fld"><label for="t_sub">日期</label><input type="text" id="t_sub" placeholder="例：2027年3月12日 - 2027年3月16日"><span class="hint" style="margin-top:4px">用呢個格式，旅行期間會自動跳去當日</span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ── Supabase connection (the publishable key is meant to be public; the database's security rules decide who can change things) ── */
const SUPABASE_URL = "https://xpzyvonlnegmkxlgjunp.supabase.co";
const SUPABASE_KEY = "sb_publishable_cklQbsRfsKoiCD6HfTdzoQ_F4BupHQ0";
const PHOTO_BUCKET = "photos";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const ic = (n,cls="") => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const WAVE = `<svg class="wave" viewBox="0 0 240 8" preserveAspectRatio="none" aria-hidden="true"><path d="M0 4q7.5-4 15 0t15 0 15 0 15 0 15 0 15 0 15 0 15 0 15 0 15 0 15 0 15 0 15 0 15 0 15 0 15 0" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;

let sb = null, session = null, canWrite = false;
let trips = {}, items = [], cur = null, filter = "all", editingItem = null, editingTrip = null, photoBlob = null;
let loaded = {trips:false, items:false}, loadError = false, jumpedToday = false;

/* ── field names: page uses camelCase, database uses snake_case ── */
const SPECIAL = {trip:"trip_id", order:"sort_order", createdAt:"created_at"};
const SPECIAL_BACK = Object.fromEntries(Object.entries(SPECIAL).map(([a,b])=>[b,a]));
const toDb = o => Object.fromEntries(Object.entries(o).map(([k,v])=>[SPECIAL[k] || k.replace(/[A-Z]/g,m=>"_"+m.toLowerCase()), v]));
const fromDb = r => {
  const o = {};
  for (const [k,v] of Object.entries(r)) o[SPECIAL_BACK[k] || k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase())] = v;
  for (const k of ["fx","taxRate","lp","hk"]) if (o[k] != null) o[k] = Number(o[k]);
  if (o.createdAt) o.createdAt = Date.parse(o.createdAt);
  return o;
};

/* theme */
(function(){const t=ls.get("theme"); if(t) document.documentElement.dataset.theme=t;})();
const isDark=()=>{const r=document.documentElement; return r.dataset.theme? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;};
function themeIcon(){ $("#themeBtn").innerHTML=ic(isDark()?"sun":"moon"); }
$("#themeBtn").onclick=()=>{ const r=document.documentElement; r.dataset.theme=isDark()?"light":"dark"; ls.set("theme",r.dataset.theme); themeIcon(); };
themeIcon();

function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2000);}

/* ── loading ── */
async function loadTrips(){
  const {data,error} = await sb.from("trips").select("*");
  if(error){loadError=true; loaded.trips=true; render(); return;}
  trips = {}; data.forEach(r=>{const t=fromDb(r); trips[t.id]=t; delete trips[t.id].id;});
  loaded.trips = true; render();
}
async function loadItems(){
  const {data,error} = await sb.from("items").select("*");
  if(error){loadError=true; loaded.items=true; render(); return;}
  items = data.map(fromDb); loaded.items = true; render();
}
const reloadT={};
function scheduleReload(which){clearTimeout(reloadT[which]); reloadT[which]=setTimeout(which==="trips"?loadTrips:loadItems,250);}

/* ── writes: change the screen first, then save; reload if saving fails ── */
function failed(error){
  if(!error) return false;
  console.error(error);
  if(error.code==="42501" || /row-level security/i.test(error.message||"")) toast("你冇權限修改呢份清單");
  else toast("儲存唔到，請再試");
  loadTrips(); loadItems();
  return true;
}
async function updateItem(id, patch){
  const it=items.find(x=>x.id===id); if(it) Object.assign(it,patch); render();
  const {error}=await sb.from("items").update(toDb(patch)).eq("id",id);
  return !failed(error);
}
async function updateTrip(id, patch){
  if(trips[id]) Object.assign(trips[id],patch); render();
  const {error}=await sb.from("trips").update(toDb(patch)).eq("id",id);
  return !failed(error);
}

/* trip helpers */
const tripList=()=>Object.entries(trips).map(([id,t])=>({id,...t}));
const activeTrips=()=>tripList().filter(t=>!t.archived).sort((a,b)=>(a.order??0)-(b.order??0));
const pastTrips=()=>tripList().filter(t=>t.archived).sort((a,b)=>(b.order??0)-(a.order??0));
const T=()=>trips[cur]||null;
function pickTrip(){
  if(cur && trips[cur]) return;
  const saved=ls.get("trip");
  if(saved && trips[saved] && !trips[saved].archived){cur=saved;return;}
  const a=activeTrips(); cur=a.length?a[0].id:(pastTrips()[0]?.id||null);
}
const tripItems=id=>items.filter(i=>i.trip===id);
const taxOn=()=>ls.get("tax:"+cur)==="1";
const photoUrl=p=>p? sb.storage.from(PHOTO_BUCKET).getPublicUrl(p).data.publicUrl : "";
const L=t=>t?.localLabel||"當地";
const shopLabel=(t,id)=>(t.shops||[]).find(s=>s.id===id)?.label||"";

/* dates: read "2026年11月11日 - 2026年11月15日" from the trip's date text */
const WD="日一二三四五六";
function tripDates(t){
  const m=[...String(t?.sub||"").matchAll(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/g)];
  if(!m.length) return null;
  const d=x=>new Date(+x[1],+x[2]-1,+x[3]);
  return {start:d(m[0]), end:d(m[m.length-1])};
}
function shortDate(t){
  const r=tripDates(t); if(!r) return t?.sub||"";
  const a=r.start, b=r.end;
  if(+a===+b) return `${a.getMonth()+1}/${a.getDate()}`;
  return a.getMonth()===b.getMonth()? `${a.getMonth()+1}/${a.getDate()}–${b.getDate()}` : `${a.getMonth()+1}/${a.getDate()}–${b.getMonth()+1}/${b.getDate()}`;
}
const dayNo=(d,ix)=>{const m=/(\d+)/.exec(d?.label||""); return m?+m[1]:ix+1;};
function dayDate(t,d,ix){ const r=tripDates(t); if(!r) return null; const x=new Date(r.start); x.setDate(x.getDate()+dayNo(d,ix)-1); return x; }
function todayNo(t){
  const r=tripDates(t); if(!r) return null;
  const now=new Date(); const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const n=Math.round((today-r.start)/864e5)+1;
  return n>=1 && n<=Math.round((r.end-r.start)/864e5)+1 ? n : null;
}
const itemOnDay=(i,d)=>!!i.day && (i.day===d.label || i.day.startsWith(d.label+" "));
const viewMode=t=>{const v=ls.get("view:"+cur); return (v==="shop"||!(t.plan||[]).length)?"shop":"day";};

/* money */
function money(v){ if(v==null||isNaN(v)) return "—"; return "HK$"+(Math.abs(v)>=100?Math.round(v).toLocaleString():(Math.round(v*10)/10).toString()); }
function local(v,t){ if(v==null) return "—"; return (t?.symbol||"")+Number(v).toLocaleString(); }
function toHkd(i,t){ if(i.lp==null||!t?.fx) return null; let h=i.lp/t.fx; if(taxOn()&&t.taxRate) h*=1-t.taxRate/100; return h; }
function verdict(i,t){
  const l=toHkd(i,t);
  if(l==null||i.hk==null) return {cls:"unknown",txt:""};
  const d=i.hk-l, pct=d/i.hk*100;
  if(Math.abs(pct)<5) return {cls:"even",txt:"兩邊差唔多（相差 "+money(Math.abs(d))+"）"};
  return d>0? {cls:"win",txt:L(t)+"平 "+money(d)+"（平 "+Math.round(pct)+"%）"} : {cls:"lose",txt:"香港平 "+money(-d)+"（"+L(t)+"貴 "+Math.round(-pct)+"%）"};
}

/* ── render ── */
function renderAuth(){
  const b=$("#authBtn");
  if(session){
    b.innerHTML=canWrite? ic("pen")+"<span>可修改</span>" : ic("user")+"<span>只可睇</span>";
    b.classList.toggle("on",canWrite); b.title=session.user.email; b.setAttribute("aria-label","帳戶："+session.user.email);
  } else { b.innerHTML=ic("user")+"<span>登入</span>"; b.classList.remove("on"); b.title="登入先可以修改"; b.setAttribute("aria-label","登入"); }
}
function renderBar(t){
  const b=$("#addBtn"), forItem=!!t && !t.archived;
  b.innerHTML=ic("plus")+(forItem?"新增商品":"新行程");
  b.disabled=!loaded.trips || loadError || (!!session && !canWrite);
}
function render(){
  pickTrip(); renderAuth();
  const t=T();
  renderTripbar(); renderPast(); renderBar(t);
  if(!t){
    $("#tName").textContent="旅行購物清單";
    $("#tSub").textContent=loaded.trips?(loadError?"":"未有行程"):"載入緊…";

    $("#panels").hidden=true;
    $("#list").innerHTML=loadError?`<div class="empty"><b>連唔到資料庫</b><br>可能係 Supabase 免費 project 停咗（7 日冇人用會自動暫停）。去 Supabase Dashboard 撳 Resume，再重新載入呢頁。</div>`
      : loaded.trips?`<div class="empty"><b>未有任何行程</b><br>撳下面「＋ 新行程」開始，或者叫 Claude 幫你建立。</div>`:`<div class="empty">載入緊清單…</div>`;
    setStats([]); return;
  }

  document.title=t.name||"旅行購物清單";
  $("#tName").textContent=t.name; $("#tSub").textContent=shortDate(t);

  if(session && !canWrite) ban+=`<div class="banner info"><span>你用 ${esc(session.user.email)} 登入咗，但呢個電郵未有修改權限，只可以睇。</span></div>`;

  $("#banner").innerHTML=ban;
  const ub=$("#unarchBtn"); if(ub) ub.onclick=()=>updateTrip(cur,{archived:false}).then(ok=>ok&&toast("已取消封存"));
  renderSettings(t); renderPlan(t); renderSeg(t); renderChips(t);
  const its=tripItems(cur); setStats(its,t); renderList(its,t);
  maybeJumpToday(t);
}

function setStats(its,t){

function passes(i,t){
  switch(filter){
    case "todo": return !i.bought;
    case "pri": return !!i.pri;
    case "win": return verdict(i,t).cls==="win";
    case "lose": return verdict(i,t).cls==="lose";
    case "gift": return !!i.gift;
  } return true;
}
const sortItems=g=>g.sort((a,b)=>(!!a.bought-!!b.bought)||(!!b.pri-!!a.pri)||((a.createdAt||0)-(b.createdAt||0)));

function renderList(its,t){
  if(!loaded.items){$("#list").innerHTML=`<div class="empty">載入緊清單…</div>`;return;}
  if(!its.length){
    $("#list").innerHTML=`<div class="empty"><b>清單仲係空嘅</b><br>傳截圖或者貨品名畀 Claude，佢會查埋${esc(L(t))}同香港價錢再加入嚟。<br>或者撳下面「＋ 新增商品」自己加。</div>`;return;
  }
  const shown=its.filter(i=>passes(i,t));
  if(!shown.length){$("#list").innerHTML=`<div class="empty">呢個篩選冇貨品。</div>`;return;}
  if(viewMode(t)==="day") return renderByDay(shown,t);
  const shops=t.shops||[], order=shops.map(s=>s.id);
  const groups={};
  shown.forEach(i=>{const k=order.includes(i.shop)?i.shop:"_other";(groups[k]=groups[k]||[]).push(i);});
  const keys=[...order.filter(k=>groups[k]),...(groups._other?["_other"]:[])];
  $("#list").innerHTML=keys.map(k=>{
    const g=sortItems(groups[k]);
    const label=k==="_other"?"其他":shopLabel(t,k);
    return `<div class="ghead"><h2>${esc(label)}</h2><span class="n">${g.length} 件</span></div>`+g.map(i=>card(i,t,"shop")).join("");
  }).join("");
}

function renderByDay(shown,t){
  const days=t.plan||[], tn=todayNo(t), all=filter==="all";
  let h="";
  days.forEach((d,ix)=>{
    const g=sortItems(shown.filter(i=>itemOnDay(i,d)));
    if(!g.length && !all) return;
    const n=dayNo(d,ix), dt=dayDate(t,d,ix), isToday=tn===n;
    const stops=(d.stops||[]).filter(s=>s.shop).map(s=>s.name).join("、");
    const when=dt?`<span class="when">${dt.getMonth()+1}/${dt.getDate()}（${WD[dt.getDay()]}）</span>`:"";
    const meta=[when+(isToday?`<span class="today-pill">今日</span>`:""), esc(stops||d.short||"")].filter(Boolean).join(" · ");
    h+=`<section class="dsec${isToday?" today":""}" id="day-${n}">
      <div class="dhead"><div class="dnum"><span>Day</span><b>${n}</b></div>
        <div class="dmain"><h2>${esc(d.title||d.short||d.label)}</h2><div class="dmeta">${meta}</div></div>
        ${g.length?`<span class="dcount">${g.length} 件</span>`:""}</div>${WAVE}
      ${g.length?g.map(i=>card(i,t,"day")).join(""):`<div class="dempty">呢日冇要買嘅嘢</div>`}
    </section>`;
  });
  const rest=sortItems(shown.filter(i=>!days.some(d=>itemOnDay(i,d))));
  if(rest.length) h+=`<section class="dsec" id="day-none"><div class="ghead" style="margin-top:0"><h2>未定日子</h2><span class="n">${rest.length} 件</span></div>${rest.map(i=>card(i,t,"day")).join("")}</section>`;
  $("#list").innerHTML=h;
}

function row(k,v){return `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`;}
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
const srcRow=(k,s,u)=>(!s&&!safeUrl(u))?"":row(k, safeUrl(u)?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(s||"打開連結")} ↗</a>`:esc(s));
function card(i,t,view){
  const b=!!i.bought, q=i.qty||1, v=verdict(i,t), title=i.zh||i.en||i.brand||"未命名";
  const img=i.img?`<img src="${esc(photoUrl(i.img))}" alt="${esc(title)}" loading="lazy" onerror="this.remove()">`:"";
  const where=view==="day"? shopLabel(t,i.shop) : (i.day||"");
  const badges=[where?`<span class="bdg where">${esc(where)}</span>`:"",i.pri?`<span class="bdg pri">必買</span>`:"",
    i.warn?`<span class="bdg warn">${esc(i.warn)}</span>`:"",i.gift?`<span class="bdg gift">送 ${esc(i.gift)}</span>`:""].join("");
  const meta=[i.brand && i.brand!==title?i.brand:"", i.size||"", i.zh&&i.en?i.en:""].filter(Boolean).map(esc).join(" · ");
  const l=toHkd(i,t);
  const lp=i.lp!=null?`<span><span class="amt">${local(i.lp,t)}</span>${l!=null?`<span class="conv">≈ ${money(l)}${taxOn()&&t.taxRate?" 退稅後":""}</span>`:""}</span>`:`<span class="conv" style="margin:0">未有${esc(L(t))}價</span>`;
  const hk=i.hk!=null?`<span class="hk">香港<b>${money(i.hk)}</b></span>`:`<span class="hk none">未有香港價</span>`;
  const rows=[srcRow(esc(L(t))+"價來源",i.lpSrc,i.lpUrl), srcRow("香港價來源",i.hkSrc,i.hkUrl), i.unit?row("比價單位",esc(i.unit)):"",
    i.hkAlt?row("其他港價",esc(i.hkAlt)):"", safeUrl(i.link)?row("商品頁",`<a href="${esc(i.link)}" target="_blank" rel="noopener">打開 ↗</a>`):""].join("");
  const editBtn=canWrite&&!t.archived?`<div class="linkbtns"><button class="lbtn" data-act="edit">修改</button></div>`:"";
  const more=(rows||i.note||editBtn)?`<details class="more"><summary>詳情${ic("chev")}</summary><div class="mbody">${rows}${i.note?`<div class="note">${esc(i.note)}</div>`:""}${editBtn}</div></details>`:"";
  const dis=canWrite?"":" disabled";
  return `<article class="card${b?" bought":""}" data-id="${esc(i.id)}">
    <div class="ctop"><div class="thumb">${img||ic("camera")}</div>
      <div class="cmain"><h3 class="nzh">${esc(title)}</h3>${meta?`<div class="meta">${meta}</div>`:""}
        ${i.local?`<button class="lname" data-act="staff" aria-label="放大俾店員睇：${esc(i.local)}">${ic("show")}<span>${esc(i.local)}</span></button>`:""}
        ${badges?`<div class="badges">${badges}</div>`:""}</div></div>
    <div class="price">${lp}${hk}</div>
    ${v.txt?`<div class="verdict ${v.cls}">${esc(v.txt)}</div>`:""}
    <div class="acts">
      <button class="buy" data-act="buy" aria-pressed="${b}"${dis}>${b?ic("check")+"已買":"買咗未？"}</button>
      <div class="qty"><button data-act="minus" aria-label="減一件"${dis}>${ic("minus","sm")}</button><span aria-label="數量">${q}</span><button data-act="plus" aria-label="加一件"${dis}>${ic("plus","sm")}</button></div>
      <button class="iconbtn p" data-act="pri" aria-pressed="${!!i.pri}" title="必買" aria-label="必買"${dis}>${ic("star")}</button>
    </div>
    ${more}
  </article>`;
}

  try{
    const bmp=await createImageBitmap(file); const W=600,H=800,c=document.createElement("canvas");c.width=W;c.height=H;

};
$("#itemDel").onclick=()=>{
  const it=editingItem; if(!it) return; $("#itemDlg").close();
  ask("刪除「"+(it.zh||it.en)+"」？","刪除之後救唔返。","刪除",async()=>{
    items=items.filter(x=>x.id!==it.id); render();
    const {error}=await sb.from("items").delete().eq("id",it.id);
    if(!failed(error)){ toast("已刪除"); if(it.img) sb.storage.from(PHOTO_BUCKET).remove([it.img]); }
  });
};

function openTripDlg(id){
  if(needSignIn()) return;
  const t=id?trips[id]:null; editingTrip=id||null; $("#tripMsg").textContent="";
  $("#tripDlgTitle").textContent=t?"修改行程資料":"新行程"; $("#tripSave").textContent=t?"儲存":"建立行程";
  $("#t_name").value=t?.name||""; $("#t_sub").value=t?.sub||""; $("#t_fx").value=t?.fx??""; $("#t_tax").value=t?.taxRate??"";
  $("#t_shops").value=(t?.shops||[]).map(s=>s.label).join(", ");
  const sel=$("#t_cur"); const m=[...sel.options].find(o=>o.value.startsWith((t?.currency||"JPY")+"|")); sel.value=m?m.value:sel.options[0].value;
  $("#tripDlg").showModal();
}
$("#newTripBtn").onclick=()=>openTripDlg(null);
$("#tripForm").onsubmit=async e=>{
  e.preventDefault();
  const [currency,symbol,localLabel]=$("#t_cur").value.split("|");
  const old=editingTrip?trips[editingTrip]:null;
  const labels=$("#t_shops").value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean);
  const shops=labels.map((l,ix)=>old?.shops?.find(s=>s.label===l)||{id:"s"+Date.now().toString(36)+ix,label:l});
  const data={name:$("#t_name").value.trim(), sub:$("#t_sub").value.trim(), currency, symbol, localLabel,
    currencyName:$("#t_cur").selectedOptions[0].textContent.split(" ")[0], fx:num($("#t_fx").value), taxRate:num($("#t_tax").value), shops};
  $("#tripSave").disabled=true;
  let ok;
  if(old) ok=await updateTrip(editingTrip,data);
  else{
    const id="t-"+crypto.randomUUID().slice(0,8);
    const order=Math.max(0,...tripList().map(x=>x.order||0))+1;
    const {error}=await sb.from("trips").insert(toDb({id,...data,archived:false,order,plan:[]}));
    ok=!failed(error);
    if(ok){ cur=id; ls.set("trip",id); await loadTrips(); }
  }
  $("#tripSave").disabled=false;
  if(ok){ $("#tripDlg").close(); toast(old?"已儲存":"已建立行程"); render(); }
};

/* ── who's signed in, and may they edit? ── */
async function checkEditor(){
  canWrite=false;
  if(session){
    const {data}=await sb.from("editors").select("email").limit(1);
    canWrite=!!(data&&data.length);
  }
  render();
}

/* ── boot ── */
render();
(async()=>{
  if(!window.supabase){ loadError=true; loaded.trips=loaded.items=true; render(); return; }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.onAuthStateChange((evt,s)=>{
    const changed=(s?.user?.id)!==(session?.user?.id);
    session=s;
    if(changed || evt==="SIGNED_IN"){
      checkEditor();
      if(evt==="SIGNED_IN" && location.hash.includes("access_token")) history.replaceState(null,"",location.pathname+location.search);
    }
  });
  const {data:{session:s}}=await sb.auth.getSession(); session=s;
  await Promise.all([loadTrips(),loadItems(),checkEditor()]);
  sb.channel("list-changes")
    .on("postgres_changes",{event:"*",schema:"public",table:"trips"},()=>scheduleReload("trips"))
    .on("postgres_changes",{event:"*",schema:"public",table:"items"},()=>scheduleReload("items"))
    .subscribe();
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ loadTrips(); loadItems(); } });
})();
</script>
